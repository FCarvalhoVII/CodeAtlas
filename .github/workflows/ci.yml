name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src tests benchmarks
      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test wheel in a clean environment
        run: |
          python -m venv /tmp/codeatlas-smoke
          /tmp/codeatlas-smoke/bin/python -m pip install dist/*.whl
          /tmp/codeatlas-smoke/bin/codeatlas --help
          mkdir /tmp/codeatlas-fixture
          printf 'def answer():\n    return 42\n' > /tmp/codeatlas-fixture/main.py
          cd /tmp
          /tmp/codeatlas-smoke/bin/codeatlas index /tmp/codeatlas-fixture
          /tmp/codeatlas-smoke/bin/codeatlas status --repository /tmp/codeatlas-fixture

